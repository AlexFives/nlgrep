[package]
name = "nlgrep"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Natural-language grep powered by pluggable model adapters"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nlgrep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
humantime = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3"
proptest = "1"
tempfile = "3"
wiremock = "0.6"
